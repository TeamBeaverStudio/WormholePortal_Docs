[project]
site_name = "Wormhole Portal"
site_description = "Official documentation for the Wormhole Portal plugin for Unreal Engine."
site_author = "Team Beaver Studio"
site_url = "https://teambeaverstudio.github.io/WormholePortal_Docs/"
repo_url = "https://github.com/TeamBeaverStudio/WormholePortal_Docs"
repo_name = "TeamBeaverStudio/WormholePortal_Docs"
edit_uri = "edit/main/docs/"
copyright = """
Copyright &copy; 2026 Team Beaver Studio
"""
nav = [
  { "Home" = "index.md" },
]
extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
